name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt pytest
      - name: Fetch revenue contract runtime
        run: |
          git clone --depth 1 https://github.com/zhengcb81/revenue-forecast.git ../revenue-forecast
          echo "REVENUE_FORECAST_DIR=$(cd ../revenue-forecast && pwd)" >> "$GITHUB_ENV"
      - name: Run test suite
        run: python -m pytest invest-core invest-framework invest-financials invest-valuation invest-sotp invest-moat invest-management invest-distribution invest-compare invest-psychology -q
      - name: Lint
        run: python -m ruff check .
      - name: Run Biren invest E2E
        run: python e2e/run_biren_invest_e2e.py
